# ============================================================
# 自定义类别数据集配置（考核核心：检测 YOLO 80 类之外的物体）
#
# !!! 路径坑 !!!
# ultralytics 解析相对 path 时，基准是【运行时的工作目录】，不是 yaml 所在目录。
# 所以在 configs/ 里写 datasets/armor，你在仓库根目录训练没问题，
# 换个目录执行就会找不到数据集。
#
# 本项目的 train.py / val.py 会把这里的相对路径按【仓库根目录】解析成绝对路径，
# 再写一份临时 yaml 交给 ultralytics，所以你在哪执行都行。
# 只有直接用 yolo 命令行时，才需要在仓库根目录执行。
# ============================================================

path: datasets/armor

train: images/train
val: images/val
test: images/test

# 类别数必须和 names 的条目数一致，标签里的 class_id 必须落在 0..nc-1
nc: 2

names:
  0: blue_armor
  1: red_armor
